<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>For my baby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#0d1128;
    --navy-mid:#171d3d;
    --paper:#f7f0e3;
    --paper-shadow:#e7dcc7;
    --ink:#2c2438;
    --ink-soft:#5c5470;
    --rose-gold:#dba07c;
    --soft-gold:#e8c37e;
    --lavender:#9b96c4;
    --star:#fdf6e3;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--navy-deep);
    overflow:hidden;
    font-family:'Jost',sans-serif;
  }

  #cosmos{
    position:fixed;
    inset:0;
    background:radial-gradient(ellipse at 50% 20%, var(--navy-mid), var(--navy-deep) 70%);
    z-index:0;
  }

  .star{
    position:absolute;
    border-radius:50%;
    background:var(--star);
    opacity:0.25;
    transition:opacity 2.5s ease, transform 2.5s ease;
  }

  .star.twinkle{ animation:twinkle 4s ease-in-out infinite; }

  @keyframes twinkle{
    0%,100%{opacity:0.15;}
    50%{opacity:0.6;}
  }

  #cosmos.bloom .star{
    opacity:0.9;
    transform:scale(1.4);
  }

  #app{
    position:fixed;
    inset:0;
    z-index:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  #stage{
    width:100%;
    max-width:560px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
  }

  .fade-in{ animation:fadeIn 1.1s ease forwards; }
  .fade-out{ animation:fadeOut 0.6s ease forwards; }

  @keyframes fadeIn{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }
  @keyframes fadeOut{
    from{opacity:1;}
    to{opacity:0;}
  }

  .open-line{
    color:var(--paper);
    font-size:clamp(1.25rem, 4.2vw, 1.7rem);
    line-height:1.55;
    font-weight:300;
    letter-spacing:0.01em;
    max-width:420px;
  }

  .tap-hint{
    margin-top:48px;
    color:var(--lavender);
    font-size:0.85rem;
    letter-spacing:0.08em;
    opacity:0.7;
  }

  .btn{
    margin-top:40px;
    background:transparent;
    border:1px solid var(--rose-gold);
    color:var(--rose-gold);
    padding:13px 34px;
    font-family:'Jost',sans-serif;
    font-size:0.95rem;
    letter-spacing:0.04em;
    border-radius:2px;
    cursor:pointer;
    transition:background 0.35s ease, color 0.35s ease;
  }
  .btn:hover{ background:var(--rose-gold); color:var(--navy-deep); }

  .btn-row{
    display:flex;
    gap:16px;
    margin-top:44px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .btn-quiet{
    background:transparent;
    border:1px solid rgba(155,150,196,0.5);
    color:var(--lavender);
    padding:12px 28px;
    font-family:'Jost',sans-serif;
    font-size:0.9rem;
    border-radius:2px;
    cursor:pointer;
    transition:border-color 0.3s ease, color 0.3s ease;
  }
  .btn-quiet:hover{ border-color:var(--lavender); color:var(--star); }

  /* Envelope */
  .envelope-wrap{
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .envelope{
    position:relative;
    width:min(78vw, 300px);
    height:min(52vw, 200px);
  }
  .env-body{
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, var(--paper), var(--paper-shadow));
    border-radius:6px;
    box-shadow:0 20px 60px rgba(0,0,0,0.45);
  }
  .env-flap{
    position:absolute;
    top:0; left:0; right:0;
    height:0;
    border-left:calc(min(78vw, 300px) / 2) solid transparent;
    border-right:calc(min(78vw, 300px) / 2) solid transparent;
    border-top:calc(min(52vw, 200px) * 0.62) solid var(--paper-shadow);
    transform-origin:top center;
    transition:transform 0.9s cubic-bezier(0.6,0,0.2,1);
    filter:drop-shadow(0 6px 10px rgba(0,0,0,0.25));
  }
  .envelope.open .env-flap{
    transform:rotateX(180deg);
  }
  .seal{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-46%);
    width:46px; height:46px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--rose-gold), #a75f42);
    display:flex; align-items:center; justify-content:center;
    color:var(--paper);
    font-size:1.2rem;
    box-shadow:0 4px 10px rgba(0,0,0,0.4);
    z-index:2;
    transition:opacity 0.4s ease;
  }
  .envelope.open .seal{ opacity:0; }
  .env-label{
    margin-top:26px;
    color:var(--paper);
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:1.3rem;
    letter-spacing:0.02em;
  }

  /* Letter card */
  .letter-card{
    background:var(--paper);
    color:var(--ink);
    border-radius:4px;
    padding:clamp(28px, 6vw, 56px) clamp(24px, 7vw, 52px);
    box-shadow:0 30px 80px rgba(0,0,0,0.5);
    max-width:520px;
    width:100%;
    min-height:clamp(260px, 42vh, 380px);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    cursor:pointer;
    position:relative;
  }
  .letter-card::before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px solid rgba(44,36,56,0.12);
    border-radius:2px;
    pointer-events:none;
  }

  .line{
    font-size:clamp(1.05rem, 3.4vw, 1.28rem);
    line-height:1.6;
    font-weight:300;
    color:var(--ink-soft);
  }

  .line.big{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:600;
    font-size:clamp(1.6rem, 5.4vw, 2.4rem);
    color:var(--ink);
    line-height:1.35;
  }

  .signature-name{
    font-family:'Cormorant Garamond', serif;
    color:var(--soft-gold);
    font-size:clamp(1.6rem, 5vw, 2.2rem);
    font-weight:500;
    letter-spacing:0.02em;
  }

  .final-glow{
    color:var(--paper);
  }

  .card-hint{
    position:absolute;
    bottom:14px;
    right:18px;
    font-size:0.7rem;
    color:rgba(44,36,56,0.35);
    letter-spacing:0.06em;
  }

  @media (prefers-reduced-motion: reduce){
    .fade-in, .fade-out, .star.twinkle{ animation:none !important; }
    .env-flap{ transition:none; }
  }
</style>
</head>
<body>

<div id="cosmos"></div>

<div id="app">
  <div id="stage"></div>
</div>

<script>
(function(){
  const stage = document.getElementById('stage');
  const cosmos = document.getElementById('cosmos');

  // ---------- starfield ----------
  function buildStars(n){
    const frag = document.createDocumentFragment();
    for(let i=0;i<n;i++){
      const s = document.createElement('div');
      s.className = 'star twinkle';
      const size = Math.random()*2 + 1;
      s.style.width = size+'px';
      s.style.height = size+'px';
      s.style.left = Math.random()*100+'%';
      s.style.top = Math.random()*100+'%';
      s.style.animationDelay = (Math.random()*4)+'s';
      frag.appendChild(s);
    }
    cosmos.appendChild(frag);
  }
  buildStars(90);

  // ---------- content data ----------
  const openingLines = [
    "Baby, I have something I've been wanting to tell you.",
    "I could probably just text you this…",
    "…but you deserve more than a text."
  ];

  const letterScenes = [
    {
      lines:[
        "Hey baby,",
        "I honestly don't know how to start this without making it awkward, so I'm just going to be honest.",
        "There are so many things I've wanted to tell you, but every time I try to say them, I never seem to find the right words.",
        "So I decided to write them instead."
      ]
    },
    {
      lines:[
        "There were times when I wasn't doing okay. Times when I felt lost, tired, or just wasn't myself.",
        "And during those moments, you were there.",
        "You listened to me. You talked to me. You cared about me. Sometimes you probably didn't even realize how much those little things meant to me.",
        "But I noticed.",
        "I remember how you made difficult days feel a little easier.",
        "You didn't have to fix everything. You didn't have to have the perfect words.",
        "Just having you there meant more to me than I knew how to explain."
      ]
    },
    {
      lines:[
        {big:true, text:"And then… there was you."},
        "Baby, you're beautiful.",
        "I know that's probably something you've heard before, but I don't mean it as some empty compliment.",
        "There are moments when I look at you and genuinely wonder how you can be that pretty without even trying.",
        "It's your smile. Your expressions. The little things you probably don't think anyone notices.",
        "I notice.",
        "And somehow, you're also ridiculously cute.",
        "The little things you do. The way you react to things. Your random moments. The way you can make me smile without even trying.",
        "Sometimes I don't even know what you're doing, but somehow I'm sitting there thinking…",
        {big:true, text:"Why is my baby so cute?"}
      ]
    },
    {
      lines:[
        "But honestly…",
        "It's not just because you're beautiful.",
        "It's not just because you're cute.",
        "It's because you're you.",
        "The way you care. The way you talk. The little things about your personality that make you completely yourself.",
        "That's what made me start falling for you."
      ]
    },
    {
      lines:[
        "Somewhere along the way…",
        "You stopped being just someone I cared about.",
        "You became someone I started looking forward to.",
        "Someone I wanted to talk to.",
        "Someone whose happiness started mattering to me.",
        "Someone I didn't want to lose.",
        {big:true, text:"And I realized I like you. A lot."}
      ]
    },
    {
      lines:[
        "I don't know exactly what the future looks like.",
        "But I know I want to be there.",
        "I want to be someone you can talk to when you're happy.",
        "Someone you can lean on when things aren't going well.",
        "Someone who celebrates your little victories with you.",
        "Someone who gets to know all the little things that make you, you.",
        "I don't just want to admire you from a distance.",
        {big:true, text:"I want to be part of your life."}
      ]
    },
    {
      lines:[
        "So, baby…",
        "I guess there's really only one thing left for me to say.",
        {big:true, text:"I like you."},
        {big:true, text:"I really, really like you."},
        "And I've been wanting to tell you for a while."
      ]
    },
    {
      lines:[
        "Baby,",
        "You became someone incredibly special to me.",
        "You've been there for me when I wasn't at my best, you've made me smile when I needed it, and somehow you've become one of the people I care about the most.",
        "I don't know if you feel exactly the same way.",
        "And that's okay.",
        "I'm asking because I want to be honest with you about how I feel.",
        {big:true, text:"Baby…"},
        {big:true, text:"Will you be my girlfriend?"},
        "I want to make memories with you.",
        "I want to be there for you.",
        "I want to see where this could go.",
        "And most of all…",
        {big:true, text:"I want it to be us."}
      ],
      final:true
    }
  ];

  // ---------- state machine ----------
  let state = 'opening';
  let openIdx = 0;
  let sceneIdx = 0;
  let lineIdx = 0;

  function clearStage(cb){
    const existing = stage.firstElementChild;
    if(existing){
      existing.classList.add('fade-out');
      setTimeout(()=>{ stage.innerHTML=''; cb(); }, 550);
    } else {
      cb();
    }
  }

  function renderOpening(){
    const wrap = document.createElement('div');
    wrap.className = 'fade-in';
    const p = document.createElement('div');
    p.className = 'open-line';
    p.textContent = openingLines[openIdx];
    wrap.appendChild(p);

    if(openIdx < openingLines.length - 1){
      const hint = document.createElement('div');
      hint.className = 'tap-hint';
      hint.textContent = 'tap to continue';
      wrap.appendChild(hint);
      wrap.onclick = ()=>{ openIdx++; clearStage(renderOpening); };
    } else {
      const btn = document.createElement('button');
      btn.className = 'btn';
      btn.textContent = 'Open it.';
      btn.onclick = (e)=>{ e.stopPropagation(); clearStage(renderEnvelope); };
      wrap.appendChild(btn);
    }
    stage.appendChild(wrap);
  }

  function renderEnvelope(){
    state = 'envelope';
    const wrap = document.createElement('div');
    wrap.className = 'envelope-wrap fade-in';

    const env = document.createElement('div');
    env.className = 'envelope';
    env.innerHTML = `
      <div class="env-body"></div>
      <div class="seal">♥</div>
      <div class="env-flap"></div>
    `;
    wrap.appendChild(env);

    const label = document.createElement('div');
    label.className = 'env-label';
    label.textContent = 'For my baby.';
    wrap.appendChild(label);

    wrap.onclick = ()=>{
      if(env.classList.contains('open')) return;
      env.classList.add('open');
      label.style.transition = 'opacity 0.6s ease';
      label.style.opacity = '0';
      setTimeout(()=>{ clearStage(()=>renderLetterScene(0,0)); }, 850);
    };

    stage.appendChild(wrap);
  }

  function renderLetterScene(sIdx, lIdx){
    sceneIdx = sIdx; lineIdx = lIdx;
    const scene = letterScenes[sceneIdx];
    const raw = scene.lines[lineIdx];
    const isBig = typeof raw === 'object';
    const text = isBig ? raw.text : raw;

    const card = document.createElement('div');
    card.className = 'letter-card fade-in';

    const p = document.createElement('div');
    p.className = isBig ? 'line big' : 'line';
    p.textContent = text;
    card.appendChild(p);

    const isVeryLast = sceneIdx === letterScenes.length - 1 && lineIdx === scene.lines.length - 1;

    if(!isVeryLast){
      const hint = document.createElement('div');
      hint.className = 'card-hint';
      hint.textContent = '›';
      card.appendChild(hint);

      card.onclick = ()=>{
        let ns = sceneIdx, nl = lineIdx + 1;
        if(nl >= letterScenes[ns].lines.length){
          ns += 1; nl = 0;
        }
        clearStage(()=>renderLetterScene(ns, nl));
      };
    } else {
      const btnRow = document.createElement('div');
      btnRow.className = 'btn-row';

      const yes = document.createElement('button');
      yes.className = 'btn';
      yes.textContent = 'Yes';
      yes.onclick = (e)=>{ e.stopPropagation(); clearStage(renderYesEnding); };

      const wait = document.createElement('button');
      wait.className = 'btn-quiet';
      wait.textContent = 'I need time';
      wait.onclick = (e)=>{ e.stopPropagation(); clearStage(renderNeedTime); };

      btnRow.appendChild(yes);
      btnRow.appendChild(wait);
      card.appendChild(btnRow);
    }

    stage.appendChild(card);
  }

  function renderYesEnding(){
    cosmos.classList.add('bloom');

    const wrap = document.createElement('div');
    wrap.className = 'fade-in';

    const l1 = document.createElement('div');
    l1.className = 'open-line final-glow';
    l1.style.fontFamily = "'Cormorant Garamond', serif";
    l1.style.fontStyle = 'italic';
    l1.style.fontSize = 'clamp(1.5rem, 5vw, 2.1rem)';
    l1.textContent = "Then let's start our story.";
    wrap.appendChild(l1);

    stage.appendChild(wrap);

    setTimeout(()=>{
      clearStage(()=>{
        const w2 = document.createElement('div');
        w2.className = 'fade-in';
        const names = document.createElement('div');
        names.className = 'signature-name';
        names.textContent = 'Cát Tường ❤ Gioan Đạt';
        const sub = document.createElement('div');
        sub.className = 'open-line final-glow';
        sub.style.marginTop = '22px';
        sub.style.fontSize = '1rem';
        sub.style.opacity = '0.85';
        sub.textContent = "I'm really glad I finally told you.";
        w2.appendChild(names);
        w2.appendChild(sub);
        stage.appendChild(w2);
      });
    }, 2600);
  }

  function renderNeedTime(){
    const lines = [
      "That's okay, baby.",
      "Take all the time you need.",
      "I just wanted you to know how I feel.",
      "Whatever your answer is, I'm grateful that you came into my life."
    ];
    let i = 0;
    function show(){
      const wrap = document.createElement('div');
      wrap.className = 'fade-in';
      const p = document.createElement('div');
      p.className = 'open-line';
      p.textContent = lines[i];
      wrap.appendChild(p);

      if(i < lines.length - 1){
        const hint = document.createElement('div');
        hint.className = 'tap-hint';
        hint.textContent = 'tap to continue';
        wrap.appendChild(hint);
        wrap.onclick = ()=>{ i++; clearStage(show); };
      } else {
        setTimeout(()=>{
          clearStage(()=>{
            const w2 = document.createElement('div');
            w2.className = 'fade-in';
            const made = document.createElement('div');
            made.className = 'open-line';
            made.style.opacity = '0.8';
            made.style.fontSize = '0.95rem';
            made.textContent = 'Made with all my heart,';
            const names = document.createElement('div');
            names.className = 'signature-name';
            names.style.marginTop = '14px';
            names.textContent = 'Cát Tường ❤ Gioan Đạt';
            w2.appendChild(made);
            w2.appendChild(names);
            stage.appendChild(w2);
          });
        }, 2200);
      }
      stage.appendChild(wrap);
    }
    show();
  }

  renderOpening();
})();
</script>

</body>
</html>
